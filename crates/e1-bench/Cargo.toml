[package]
name = "e1-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
csv.workspace = true
ed25519-dalek = { version = "3.0.0", default-features = false }
libc.workspace = true
p3-air = "0.6"
p3-challenger = "0.6"
p3-commit = "0.6"
p3-dft = "0.6"
p3-field = "0.6"
p3-fri = "0.6"
p3-goldilocks = "0.6"
p3-keccak = "0.6"
p3-lookup = { version = "0.6", optional = true }
p3-matrix = "0.6"
p3-merkle-tree = "0.6"
p3-poseidon2 = "0.6"
p3-poseidon2-air = "0.6"
p3-symmetric = "0.6"
p3-uni-stark = "0.6"
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "b36339709a7a67ee9760fb578b3d4339fd983709", optional = true }
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "b36339709a7a67ee9760fb578b3d4339fd983709", optional = true }
p3-recursion = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "b36339709a7a67ee9760fb578b3d4339fd983709", optional = true }
postcard = { version = "1", features = ["alloc"] }
rand.workspace = true
rand_10 = { package = "rand", version = "0.10.1" }
rand_chacha.workspace = true
rayon.workspace = true
serde.workspace = true

[features]
default = []
recursion = ["dep:p3-recursion", "dep:p3-circuit", "dep:p3-circuit-prover", "dep:p3-lookup"]
