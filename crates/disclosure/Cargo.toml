[package]
name = "eudr-disclosure"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
eudr-policy = { path = "../sp1-e2e/policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false }
